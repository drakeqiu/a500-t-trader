    include /etc/nginx/resolver.conf;

    location = /healthz { return 404; }
    location = /api/healthz { return 404; }
    location = /v1 { return 404; }
    location ^~ /v1/ { return 404; }

    location ~ ^/api/v1/(account-snapshot|account-nav|trade-imports)(/|$) {
        set $account_api account-api:8000;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://$account_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/jobs(/|$) {
        set $jobs_api jobs-api:8000;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://$jobs_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/account/openapi.json {
        set $account_api account-api:8000;
        proxy_pass http://$account_api/openapi.json;
        proxy_set_header Host $http_host;
    }

    location /api/v1/ {
        set $signal_api signal-api:8000;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://$signal_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        set $frontend frontend:3000;
        proxy_pass http://$frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
