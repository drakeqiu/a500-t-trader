    location = /healthz { return 404; }
    location = /api/healthz { return 404; }
    location = /v1 { return 404; }
    location ^~ /v1/ { return 404; }

    location ~ ^/api/v1/(account-snapshot|account-nav|trade-imports)(/|$) {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://account-api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/jobs(/|$) {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://jobs-api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/account/openapi.json {
        proxy_pass http://account-api:8000/openapi.json;
        proxy_set_header Host $http_host;
    }

    location /api/v1/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://signal-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
