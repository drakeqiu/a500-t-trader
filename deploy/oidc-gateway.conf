server {
    listen 8080;
    server_name _;

    location = /healthz {
        return 404;
    }

    location ~ ^/v1/(account-snapshot|account-nav|trade-imports)(/|$) {
        proxy_pass http://account-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /account/openapi.json {
        proxy_pass http://account-api:8000/openapi.json;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://signal-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
