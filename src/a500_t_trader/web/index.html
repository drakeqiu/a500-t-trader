<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>A500 T-Trader · 实时信号</title>
    <link rel="stylesheet" href="/web/app.css" />
    <script type="module" src="/web/app.js"></script>
  </head>
  <body>
    <header class="masthead">
      <a class="brand" href="/" aria-label="A500 T-Trader 首页">
        <span class="brand-mark" aria-hidden="true">A</span>
        <span>A500 <strong>T-Trader</strong></span>
      </a>
      <div class="session-control">
        <span id="session-status" class="session-status" role="status">尚未登录</span>
        <button id="login" class="button button-primary" type="button">使用工作账户登录</button>
        <button id="logout" class="button button-quiet" type="button" hidden>退出登录</button>
      </div>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <div>
          <p class="section-label">实时监控</p>
          <h1 id="page-title">市场信号</h1>
          <p class="intro-copy">登录后读取当前 ETF 信号。数据仅供研究参考，不构成交易指令。</p>
        </div>
        <div class="access-note">
          <span class="access-indicator" aria-hidden="true"></span>
          <span>访问令牌只在当前页面内存中使用</span>
        </div>
      </section>

      <section class="signal-panel" aria-labelledby="signals-heading">
        <div class="panel-heading">
          <div>
            <p class="section-label">受保护 API</p>
            <h2 id="signals-heading">ETF 信号状态</h2>
          </div>
          <button id="load-signals" class="button button-secondary" type="button" disabled>读取信号</button>
        </div>
        <p id="feedback" class="feedback" role="status" aria-live="polite">请先登录以访问受保护数据。</p>
        <div id="signals" class="signals" aria-live="polite"></div>
      </section>
    </main>

    <footer>
      <span>A500 T-Trader</span>
      <span>登录由受信身份提供方管理；应用不提供注册。</span>
    </footer>
  </body>
</html>
