# Select this file OR compose.web-http.yaml, never both.
services:
  gateway:
    ports:
      - "${GATEWAY_HOST:-127.0.0.1}:${GATEWAY_HOST_PORT:-8443}:8080"
    volumes:
      - ./deploy/oidc-gateway-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT:?TLS_CERT is required}:/etc/nginx/tls/cert.pem:ro
      - ${TLS_KEY:?TLS_KEY is required}:/etc/nginx/tls/key.pem:ro
