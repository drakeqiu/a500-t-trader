# Select this file OR compose.web-http.yaml, never both.
services:
  gateway:
    ports:
      - "${A500_GATEWAY_HOST:-127.0.0.1}:${A500_GATEWAY_HOST_PORT:-8443}:8080"
    volumes:
      - ./deploy/oidc-gateway-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ${A500_TLS_CERT:?A500_TLS_CERT is required}:/etc/nginx/tls/cert.pem:ro
      - ${A500_TLS_KEY:?A500_TLS_KEY is required}:/etc/nginx/tls/key.pem:ro
