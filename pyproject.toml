[build-system]
requires = ["uv_build>=0.8.15,<0.13.0"]
build-backend = "uv_build"

[project]
name = "a500-t-trader"
version = "0.1.0"
description = "A500 T-Trader Python project."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "tgw==1.0.9.2",
    "AmazingData==1.1.9"
]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=8.3.5",
    "ruff>=0.11.0",
]

[tool.ruff]
target-version = "py314"
line-length = 88


[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
tgw = { path = "wheels/tgw-1.0.9.2-py3-none-any.whl" }
AmazingData = { path = "wheels/AmazingData-1.1.9-cp314-none-any.whl" }
