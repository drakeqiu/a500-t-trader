[build-system]
requires = ["uv_build>=0.8.15,<0.13.0"]
build-backend = "uv_build"

[project]
name = "a500-t-trader"
version = "0.1.0"
description = "A500 T-Trader Python project."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "tgw==1.0.9.2",
  "AmazingData==1.1.9",
  "PyYAML>=6.0.2",
  "pika>=1.3.2",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "redis>=5.2.0",
  "PyJWT[crypto]>=2.10.1",
  "python-multipart>=0.0.20",
]

[project.scripts]
a500-market-data-collector = "a500_t_trader.market_data.collector_cli:main"
a500-market-data-consumer = "a500_t_trader.market_data.consumer_cli:main"
a500-market-data-replay = "a500_t_trader.market_data.replay:main"
a500-signal-api = "a500_t_trader.signal_api:main"
a500-signal-calculator = "a500_t_trader.signal_calculator_cli:main"
a500-account-api = "a500_t_trader.account_api:main"

[dependency-groups]
dev = [
  "types-PyYAML>=6.0.12",
  "mypy>=1.15.0",
  "pytest>=8.3.5",
  "ruff>=0.11.0",
  "yamllint>=1.37.1",
  "fakeredis>=2.31.0",
  "httpx>=0.28.0",
  "playwright>=1.55.0,<2.0.0",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not live and not slow"]
markers = [
  "live: requires a live AmazingData provider connection and current data",
  "slow: full historical Issue 85 replay; run explicitly for certification",
]

[tool.uv.sources]
tgw = { path = "wheels/tgw-1.0.9.2-py3-none-any.whl" }
AmazingData = { path = "wheels/AmazingData-1.1.9-cp314-none-any.whl" }
