# Full application: combine with compose.yaml; Keycloak is optional.
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_A500_OIDC_ISSUER: ${A500_OIDC_ISSUER:?A500_OIDC_ISSUER is required}
        NEXT_PUBLIC_A500_OIDC_CLIENT_ID: ${A500_OIDC_CLIENT_ID:-a500-device-client}
    expose:
      - "3000"
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${A500_GATEWAY_HOST:-127.0.0.1}:${A500_GATEWAY_HOST_PORT:-8080}:8080"
    volumes:
      - ./deploy/oidc-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - signal-api
      - account-api
    restart: unless-stopped
