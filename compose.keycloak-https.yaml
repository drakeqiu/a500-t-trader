services:
  keycloak:
    environment:
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/tls/cert.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/tls/key.pem
    ports:
      - "127.0.0.1:${KEYCLOAK_HTTPS_HOST_PORT:?KEYCLOAK_HTTPS_HOST_PORT is required}:8443"
    volumes:
      - ${TLS_CERT:?TLS_CERT is required}:/opt/keycloak/conf/tls/cert.pem:ro
      - ${TLS_KEY:?TLS_KEY is required}:/opt/keycloak/conf/tls/key.pem:ro
