x-podman:
  in_pod: false

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-a500}
      POSTGRES_USER: ${POSTGRES_USER:-a500}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1-alpine
    hostname: rabbitmq
    ports:
      - "${RABBITMQ_BIND_HOST:-0.0.0.0}:${RABBITMQ_HOST_PORT:-5672}:5672"
    healthcheck:
      test: ["CMD", "su", "rabbitmq", "-s", "/bin/sh", "-c", "rabbitmq-diagnostics -q ping"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - signal-data:/data

  signal-calculator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        UV_INDEX_URL: ${UV_INDEX_URL:-}
        UV_HTTP_TIMEOUT: ${UV_HTTP_TIMEOUT:-}
    command: ["a500-signal-calculator", "--purpose", "signal-calculator"]
    environment:
      MARKET_DATA_MODE: ${MARKET_DATA_MODE:?MARKET_DATA_MODE must be tgw or replay}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      REDIS_URL: redis://redis:6379/0
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  signal-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UV_INDEX_URL: ${UV_INDEX_URL:-}
        UV_HTTP_TIMEOUT: ${UV_HTTP_TIMEOUT:-}
        APT_MIRROR: ${APT_MIRROR:-}
    command: ["a500-signal-api"]
    environment:
      OIDC_ISSUER: ${OIDC_ISSUER:?OIDC_ISSUER is required}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?OIDC_AUDIENCE is required}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:?OIDC_JWKS_URI is required}
      REDIS_URL: redis://redis:6379/0
      SIGNAL_API_HOST: 0.0.0.0
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  account-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UV_INDEX_URL: ${UV_INDEX_URL:-}
        UV_HTTP_TIMEOUT: ${UV_HTTP_TIMEOUT:-}
        APT_MIRROR: ${APT_MIRROR:-}
    command: ["a500-account-api"]
    environment:
      OIDC_ISSUER: ${OIDC_ISSUER:?OIDC_ISSUER is required}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?OIDC_AUDIENCE is required}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:?OIDC_JWKS_URI is required}
      AD_USERNAME: ${AD_USERNAME:-}
      AD_PASSWORD: ${AD_PASSWORD:-}
      AD_HOST: ${AD_HOST:-}
      AD_PORT: ${AD_PORT:-}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-a500}
      POSTGRES_USER: ${POSTGRES_USER:-a500}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  jobs-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UV_INDEX_URL: ${UV_INDEX_URL:-}
        UV_HTTP_TIMEOUT: ${UV_HTTP_TIMEOUT:-}
        APT_MIRROR: ${APT_MIRROR:-}
    command: ["python", "-m", "a500_t_trader.jobs_api"]
    environment:
      OIDC_ISSUER: ${OIDC_ISSUER:?OIDC_ISSUER is required}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?OIDC_AUDIENCE is required}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:?OIDC_JWKS_URI is required}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-a500}
      POSTGRES_USER: ${POSTGRES_USER:-a500}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      HISTORY_PERSISTENCE_PERMITTED: ${HISTORY_PERSISTENCE_PERMITTED:-false}
      JOB_RETENTION_DAYS: ${JOB_RETENTION_DAYS:-30}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  jobs-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UV_INDEX_URL: ${UV_INDEX_URL:-}
        UV_HTTP_TIMEOUT: ${UV_HTTP_TIMEOUT:-}
        APT_MIRROR: ${APT_MIRROR:-}
    command: ["python", "-m", "a500_t_trader.jobs"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-a500}
      POSTGRES_USER: ${POSTGRES_USER:-a500}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      AD_USERNAME: ${AD_USERNAME:-}
      AD_PASSWORD: ${AD_PASSWORD:-}
      AD_HOST: ${AD_HOST:-}
      AD_PORT: ${AD_PORT:-}
      HISTORY_PERSISTENCE_PERMITTED: ${HISTORY_PERSISTENCE_PERMITTED:-false}
      JOB_RETENTION_DAYS: ${JOB_RETENTION_DAYS:-30}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
  history-dispatcher:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UV_INDEX_URL: ${UV_INDEX_URL:-}
        UV_HTTP_TIMEOUT: ${UV_HTTP_TIMEOUT:-}
        APT_MIRROR: ${APT_MIRROR:-}
    command: ["python", "-m", "a500_t_trader.history_dispatch"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-a500}
      POSTGRES_USER: ${POSTGRES_USER:-a500}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  consumer-signals:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UV_INDEX_URL: ${UV_INDEX_URL:-}
        UV_HTTP_TIMEOUT: ${UV_HTTP_TIMEOUT:-}
        APT_MIRROR: ${APT_MIRROR:-}
    command: ["a500-market-data-consumer", "--purpose", "signals", "--max-age-seconds", "30"]
    environment: &market-data-env
      MARKET_DATA_MODE: ${MARKET_DATA_MODE:?MARKET_DATA_MODE must be tgw or replay}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  consumer-audit:
    image: ${MARKET_DATA_CONSUMER_IMAGE:-a500-market-data-consumer:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UV_INDEX_URL: ${UV_INDEX_URL:-}
        UV_HTTP_TIMEOUT: ${UV_HTTP_TIMEOUT:-}
        APT_MIRROR: ${APT_MIRROR:-}
    command: ["a500-market-data-consumer", "--purpose", "audit", "--max-age-seconds", "30"]
    environment: *market-data-env
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  replay:
    image: ${MARKET_DATA_REPLAY_IMAGE:-a500-market-data-consumer:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        UV_INDEX_URL: ${UV_INDEX_URL:-}
        UV_HTTP_TIMEOUT: ${UV_HTTP_TIMEOUT:-}
    command: ["a500-market-data-replay"]
    environment: *market-data-env
    volumes:
      - ./data:/app/data:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
    profiles: ["replay"]

volumes:
  rabbitmq-data:
  signal-data:
  postgres-data:
