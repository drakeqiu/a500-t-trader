x-podman:
  in_pod: false

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${A500_POSTGRES_DB:-a500}
      POSTGRES_USER: ${A500_POSTGRES_USER:-a500}
      POSTGRES_PASSWORD: ${A500_POSTGRES_PASSWORD:?A500_POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${A500_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1-alpine
    hostname: rabbitmq
    ports:
      - "${A500_RABBITMQ_BIND_HOST:-0.0.0.0}:${A500_RABBITMQ_HOST_PORT:-5672}:5672"
    healthcheck:
      test: ["CMD", "su", "rabbitmq", "-s", "/bin/sh", "-c", "rabbitmq-diagnostics -q ping"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - signal-data:/data

  signal-calculator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UV_INDEX_URL: ${UV_INDEX_URL:-}
    command: ["a500-signal-calculator", "--purpose", "signal-calculator"]
    environment:
      A500_MARKET_DATA_MODE: ${A500_MARKET_DATA_MODE:?A500_MARKET_DATA_MODE must be tgw or replay}
      A500_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      A500_REDIS_URL: redis://redis:6379/0
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  signal-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UV_INDEX_URL: ${UV_INDEX_URL:-}
    command: ["a500-signal-api"]
    environment:
      A500_OIDC_ISSUER: ${A500_OIDC_ISSUER:?A500_OIDC_ISSUER is required}
      A500_OIDC_AUDIENCE: ${A500_OIDC_AUDIENCE:?A500_OIDC_AUDIENCE is required}
      A500_OIDC_JWKS_URI: ${A500_OIDC_JWKS_URI:?A500_OIDC_JWKS_URI is required}
      A500_REDIS_URL: redis://redis:6379/0
      A500_SIGNAL_API_HOST: 0.0.0.0
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  account-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UV_INDEX_URL: ${UV_INDEX_URL:-}
    command: ["a500-account-api"]
    environment:
      A500_OIDC_ISSUER: ${A500_OIDC_ISSUER:?A500_OIDC_ISSUER is required}
      A500_OIDC_AUDIENCE: ${A500_OIDC_AUDIENCE:?A500_OIDC_AUDIENCE is required}
      A500_OIDC_JWKS_URI: ${A500_OIDC_JWKS_URI:?A500_OIDC_JWKS_URI is required}
      AMAZINGDATA_USERNAME: ${AMAZINGDATA_USERNAME:?AMAZINGDATA_USERNAME is required}
      AMAZINGDATA_PASSWORD: ${AMAZINGDATA_PASSWORD:?AMAZINGDATA_PASSWORD is required}
      AMAZINGDATA_HOST: ${AMAZINGDATA_HOST:?AMAZINGDATA_HOST is required}
      AMAZINGDATA_PORT: ${AMAZINGDATA_PORT:?AMAZINGDATA_PORT is required}
      A500_POSTGRES_HOST: postgres
      A500_POSTGRES_DB: ${A500_POSTGRES_DB:-a500}
      A500_POSTGRES_USER: ${A500_POSTGRES_USER:-a500}
      A500_POSTGRES_PASSWORD: ${A500_POSTGRES_PASSWORD:?A500_POSTGRES_PASSWORD is required}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  jobs-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UV_INDEX_URL: ${UV_INDEX_URL:-}
    command: ["python", "-m", "a500_t_trader.jobs_api"]
    environment:
      A500_OIDC_ISSUER: ${A500_OIDC_ISSUER:?A500_OIDC_ISSUER is required}
      A500_OIDC_AUDIENCE: ${A500_OIDC_AUDIENCE:?A500_OIDC_AUDIENCE is required}
      A500_OIDC_JWKS_URI: ${A500_OIDC_JWKS_URI:?A500_OIDC_JWKS_URI is required}
      A500_POSTGRES_HOST: postgres
      A500_POSTGRES_DB: ${A500_POSTGRES_DB:-a500}
      A500_POSTGRES_USER: ${A500_POSTGRES_USER:-a500}
      A500_POSTGRES_PASSWORD: ${A500_POSTGRES_PASSWORD:?A500_POSTGRES_PASSWORD is required}
      A500_HISTORY_PERSISTENCE_PERMITTED: ${A500_HISTORY_PERSISTENCE_PERMITTED:-false}
      A500_JOB_RETENTION_DAYS: ${A500_JOB_RETENTION_DAYS:-30}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  jobs-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UV_INDEX_URL: ${UV_INDEX_URL:-}
    command: ["python", "-m", "a500_t_trader.jobs"]
    environment:
      A500_POSTGRES_HOST: postgres
      A500_POSTGRES_DB: ${A500_POSTGRES_DB:-a500}
      A500_POSTGRES_USER: ${A500_POSTGRES_USER:-a500}
      A500_POSTGRES_PASSWORD: ${A500_POSTGRES_PASSWORD:?A500_POSTGRES_PASSWORD is required}
      A500_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      AMAZINGDATA_USERNAME: ${AMAZINGDATA_USERNAME:?AMAZINGDATA_USERNAME is required}
      AMAZINGDATA_PASSWORD: ${AMAZINGDATA_PASSWORD:?AMAZINGDATA_PASSWORD is required}
      AMAZINGDATA_HOST: ${AMAZINGDATA_HOST:?AMAZINGDATA_HOST is required}
      AMAZINGDATA_PORT: ${AMAZINGDATA_PORT:?AMAZINGDATA_PORT is required}
      A500_HISTORY_PERSISTENCE_PERMITTED: ${A500_HISTORY_PERSISTENCE_PERMITTED:-false}
      A500_JOB_RETENTION_DAYS: ${A500_JOB_RETENTION_DAYS:-30}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
  history-dispatcher:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UV_INDEX_URL: ${UV_INDEX_URL:-}
    command: ["python", "-m", "a500_t_trader.history_dispatch"]
    environment:
      A500_POSTGRES_HOST: postgres
      A500_POSTGRES_DB: ${A500_POSTGRES_DB:-a500}
      A500_POSTGRES_USER: ${A500_POSTGRES_USER:-a500}
      A500_POSTGRES_PASSWORD: ${A500_POSTGRES_PASSWORD:?A500_POSTGRES_PASSWORD is required}
      A500_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  consumer-signals:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UV_INDEX_URL: ${UV_INDEX_URL:-}
    command: ["a500-market-data-consumer", "--purpose", "signals", "--max-age-seconds", "30"]
    environment: &market-data-env
      A500_MARKET_DATA_MODE: ${A500_MARKET_DATA_MODE:?A500_MARKET_DATA_MODE must be tgw or replay}
      A500_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  consumer-audit:
    image: ${A500_MARKET_DATA_CONSUMER_IMAGE:-a500-market-data-consumer:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UV_INDEX_URL: ${UV_INDEX_URL:-}
    command: ["a500-market-data-consumer", "--purpose", "audit", "--max-age-seconds", "30"]
    environment: *market-data-env
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  replay:
    image: a500-market-data-consumer:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UV_INDEX_URL: ${UV_INDEX_URL:-}
    command: ["a500-market-data-replay"]
    environment: *market-data-env
    volumes:
      - ./data:/app/data:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
    profiles: ["replay"]

volumes:
  rabbitmq-data:
  signal-data:
  postgres-data:
