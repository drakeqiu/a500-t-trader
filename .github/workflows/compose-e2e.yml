---
name: Compose market-data E2E

on:
  push:
  pull_request:

jobs:
  compose-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download supplier wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p wheels
          gh release download deps-v1 \
            --repo "${{ github.repository }}" \
            --pattern "*.whl" \
            --dir wheels

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install locked project dependencies
        run: uv sync --frozen --no-dev

      - name: Run real RabbitMQ Compose E2E
        run: uv run --no-sync python scripts/compose-market-data-e2e.py
