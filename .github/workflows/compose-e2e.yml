---
name: Compose E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# E2E scripts also serve local development, where they default to mirrors.
env:
  APT_MIRROR: deb.debian.org
  UV_INDEX_URL: https://pypi.org/simple/
  UV_DEFAULT_INDEX: https://pypi.org/simple/

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number ||
    github.ref }}
  cancel-in-progress: true

jobs:
  market-data-e2e:
    name: Market data E2E
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download supplier wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p wheels
          gh release download deps-v1 \
            --repo "${{ github.repository }}" \
            --pattern "*.whl" \
            --dir wheels

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked project and E2E dependencies
        run: uv sync --frozen --group dev

      - name: Run RabbitMQ market data E2E
        run: uv run --no-sync python scripts/compose-market-data-e2e.py

  keycloak-e2e:
    name: Keycloak device authorization E2E
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download supplier wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p wheels
          gh release download deps-v1 \
            --repo "${{ github.repository }}" \
            --pattern "*.whl" \
            --dir wheels

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked project and E2E dependencies
        run: uv sync --frozen --group dev

      - name: Cache Python Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: >-
            playwright-python-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('uv.lock') }}

      - name: Install Python Playwright Chromium and system dependencies
        run: >-
          uv run --no-sync python -m playwright install --with-deps --only-shell
          chromium

      - name: Run Keycloak device authorization E2E with mock market data
        run: >-
          uv run --no-sync python scripts/compose-keycloak-device-e2e.py
          --mock-market-data

  compose-e2e:
    name: Market data and Keycloak E2E
    if: always()
    needs: [market-data-e2e, keycloak-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require both E2E jobs to succeed
        env:
          MARKET_DATA_RESULT: ${{ needs.market-data-e2e.result }}
          KEYCLOAK_RESULT: ${{ needs.keycloak-e2e.result }}
        run: |
          if [[ "$MARKET_DATA_RESULT" != success ||
                "$KEYCLOAK_RESULT" != success ]]; then
            echo "Market data E2E: $MARKET_DATA_RESULT"
            echo "Keycloak E2E: $KEYCLOAK_RESULT"
            exit 1
          fi
