---
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint, typecheck, and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Download supplier wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p wheels
          gh release download deps-v1 \
            --repo "${{ github.repository }}" \
            --pattern "*.whl" \
            --dir wheels

          ls -lh wheels/

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install locked Node dependencies
        run: npm ci

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: frontend

      - name: Frontend lint
        run: bun run lint
        working-directory: frontend

      - name: Frontend format check
        run: bun run format:check
        working-directory: frontend

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install locked Python dependencies
        run: uv sync --locked

      - name: Markdown lint
        run: npx --yes markdownlint-cli2

      - name: Markdown format check
        run: npx --yes prettier --check "**/*.md"

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Structured-data lint
        run: uv run yamllint --strict .github

      - name: Structured-data format check
        run: npm run format:check

      - name: mypy strict
        run: uv run mypy

      - name: pytest
        run: uv run pytest

      - name: Cache frontend Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: >-
            playwright-frontend-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('frontend/bun.lock') }}

      - name: Install frontend Playwright Chromium and system dependencies
        run: bunx playwright install --with-deps --only-shell chromium
        working-directory: frontend

      - name: Run frontend E2E tests
        run: bun run test:e2e
        working-directory: frontend
