---
name: Auto-merge

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review
      - labeled
      - unlabeled
  workflow_run:
    workflows: [CI, Compose E2E]
    types: [completed]

permissions:
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: >-
    automerge-${{ github.event.pull_request.number ||
    github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  auto-merge:
    name: Manage opt-in auto-merge
    if: >-
      github.event_name == 'workflow_run' ||
      github.event.pull_request.base.ref == 'main' ||
      (github.event.action == 'unlabeled' &&
      github.event.label.name == 'automerge')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Label and manage auto-merge for the current commit
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: >-
            ${{ github.event.pull_request.head.sha ||
                github.event.workflow_run.head_sha }}
        run: |
          if [[ "$EVENT_NAME" == workflow_run ]]; then
            PR_NUMBER=$(gh api \
              "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" |
              jq -r --arg sha "$HEAD_SHA" --arg repo "$GITHUB_REPOSITORY" \
                '[.[] | select(.state == "open" and .head.sha == $sha and
                  .head.repo.full_name == $repo and .base.ref == "main")] |
                 first | .number // empty')
          elif [[ "$EVENT_ACTION" == unlabeled ]]; then
            if [[ "$EVENT_LABEL" == automerge ]]; then
              gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
                --disable-auto
            fi
            exit 0
          elif [[ "$EVENT_ACTION" == labeled &&
                  "$EVENT_LABEL" != automerge ]]; then
            exit 0
          fi

          if [[ -z "$PR_NUMBER" ]]; then
            echo "No open same-repository pull request for $HEAD_SHA."
            exit 0
          fi

          pr=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json state,headRefOid,baseRefName,isDraft,labels)
          if ! jq -e --arg sha "$HEAD_SHA" '
            .state == "OPEN" and .headRefOid == $sha and .baseRefName == "main"
          ' <<<"$pr" >/dev/null; then
            echo "Pull request is no longer open on main at this commit."
            exit 0
          fi

          # Token-created label events do not start another workflow run.
          if [[ "$EVENT_NAME" == pull_request_target ]] &&
            ! jq -e 'any(.labels[]; .name == "automerge")' \
              <<<"$pr" >/dev/null; then
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --add-label automerge
          fi
          if [[ "$EVENT_NAME" == pull_request_target &&
                "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            echo "Fork pull request labeled; automatic merging is disabled."
            exit 0
          fi

          pr=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json state,headRefOid,baseRefName,isDraft,labels)
          if ! jq -e --arg sha "$HEAD_SHA" '
            .state == "OPEN" and .headRefOid == $sha and
            .baseRefName == "main" and .isDraft == false and
            any(.labels[]; .name == "automerge")
          ' <<<"$pr" >/dev/null; then
            echo "Pull request is draft, changed, or opted out."
            exit 0
          fi

          required_checks=(
            "Python, docs, and E2E checks"
            "Frontend checks and tests"
            "Market data and Keycloak E2E"
          )
          # gh exits 1 for failed checks and 8 for pending checks.
          check_status=0
          checks=$(gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json name,state) || check_status=$?
          case "$check_status" in
            0|1|8) ;;
            *) exit "$check_status" ;;
          esac
          checks=${checks:-'[]'}
          for name in "${required_checks[@]}"; do
            state=$(jq -r --arg name "$name" '
              [.[] | select(.name == $name)] |
              if length == 1 then .[0].state else "MISSING_OR_DUPLICATE" end
            ' <<<"$checks")
            if [[ "$state" != SUCCESS ]]; then
              echo "Required check \"$name\" is $state; awaiting completion."
              exit 0
            fi
          done

          latest_pr=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json state,headRefOid,baseRefName,isDraft,labels)
          if ! jq -e --arg sha "$HEAD_SHA" '
            .state == "OPEN" and .headRefOid == $sha and
            .baseRefName == "main" and .isDraft == false and
            any(.labels[]; .name == "automerge")
          ' <<<"$latest_pr" >/dev/null; then
            echo "Pull request changed or opted out before auto-merge."
            exit 0
          fi
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --match-head-commit "$HEAD_SHA" --auto --squash
