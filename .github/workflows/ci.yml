name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Run test suite
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v
